<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TraderApp Terminal</title>
    <script>
      // Apply the saved theme before first paint so the chart is created with
      // the right colours and the page never flashes the wrong background.
      // A terminal defaults to dark.
      (function () {
        try {
          var saved = localStorage.getItem('traderapp.theme');
          document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
