[project]
name = "traderapp-backend"
version = "1.0.0"
description = "Real-time stock charting backend: Alpaca + IBKR market data over WebSocket"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "httpx>=0.28",
    "websockets>=13",
    "tzdata>=2024.1",
    # Market screener + float/market-cap reference data.
    "tradingview-screener>=3.0",
    # Sliding-window request budgets for the upstream APIs.
    "pyrate-limiter>=4",
]

[project.optional-dependencies]
# IBKR is optional: without it the app runs on Alpaca alone.
ibkr = ["ib-async>=1.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
addopts = "-q --strict-markers"
markers = [
    "live: hits real market-data APIs; requires credentials (deselect with '-m \"not live\"')",
]
