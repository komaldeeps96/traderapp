# Copy to settings.yaml and fill in. settings.yaml is gitignored.
#
# Every value here can also come from the environment, which wins over this
# file. Nested keys use a double underscore:
#
#   TRADERAPP_ALPACA__KEY_ID=...
#   TRADERAPP_IBKR__ENABLED=false
#   TRADERAPP_LOG_LEVEL=DEBUG

log_level: INFO
default_symbol: AAPL
# The terminal trades from the 10-second chart; it is the default everywhere.
default_timeframe: 10s
# Which origins the API answers cross-origin, so the terminal opens on a phone
# or tablet over the home WiFi: the three RFC 1918 ranges, loopback and Bonjour
# names, on the dev and preview ports only. Without it the WebSocket connects —
# it is exempt from CORS — while every REST call fails, which reads as a
# half-loaded terminal rather than as a configuration problem. Set it empty to
# bind the terminal back to this laptop:
#   cors_origin_regex: ''

alpaca:
  key_id: ''
  secret_key: ''
  # iex         free, real-time, IEX exchange only
  # delayed_sip free, whole tape, delayed 15 minutes
  # sip         paid, whole tape, real time
  feed: iex
  # Live Benzinga headlines over Alpaca's news socket. Separate from `feed`,
  # which governs the price tape only: news is a different product and is not
  # delayed. Alpaca allows one news socket per account, and a second
  # connection takes it rather than sharing it, so two copies of this app
  # will trade the connection back and forth.
  news_stream: true
  # 10-second history on Alpaca is rebuilt from the raw trade tape, paged
  # newest-first; the cap bounds how far a very heavy tape is walked.
  # max_trade_pages: 40
  # The same walk for the *prior* sessions sitting behind the IBKR window.
  # Twelve pages is 120k trades — measured, the whole previous session for a
  # small-cap runner and the closing hours of it for a mega cap, which is the
  # part that has to join up with today.
  # max_prior_session_pages: 12

ibkr:
  # The app prefers IBKR for live data and falls back to Alpaca automatically
  # whenever TWS is not reachable, so leaving this on costs nothing.
  enabled: true
  host: 127.0.0.1
  port: 7496
  client_id: 1

history:
  # Minute history is one Alpaca request (newest ~10k bars); the days value
  # only bounds the requested window. The 10-second base is three slices: the
  # last 4 hours from IBKR up front, hours 4-12 from IBKR as a background
  # extension — with Alpaca's trade tape as the recent-slice fallback when TWS
  # is down — and behind those the previous session(s), always walked off
  # Alpaca's tape.
  # 20 days: the windowed-RVOL denominator wants real prior sessions,
  # not the handful a chart needs for display.
  intraday_days: 20
  # Daily history is one Alpaca request capped at 10k rows; 40 years is what
  # fills that page, so asking for less only throws away levels.
  daily_years: 40
  # How many sessions the 10-second window reaches back over, behind the
  # twelve hours IBKR serves. EMA 600 is the slowest line on that chart and
  # draws nothing at all until it has 600 bars — and a bar exists only where a
  # trade printed, so this is about the name rather than the clock. One
  # session covers a liquid runner; raise it for a genuinely thin one, at the
  # cost of one more capped tape walk per ticker switch.
  # tensec_prior_sessions: 1

tape:
  # TIME AND SALES — the print-by-print window under the context chart.
  # A separate reader on the same trade stream: no bars, no indicators, and
  # nothing here reaches either. There is no on/off switch, because a tape
  # that is not there is a window showing nothing.
  #
  # Rows held per symbol. The window itself keeps fewer; this is the depth a
  # fresh subscribe is handed, so it is really "how far back can I scroll
  # through the burst that just happened".
  buffer: 600
  # Symbols keeping a tape at once, evicted least-recently-printed. Well
  # above a session's worth of flipping between runners.
  max_symbols: 16

scanner:
  # The trade-rate scanner is IBKR-only; there is no Alpaca equivalent to
  # fall back to. The market-cap band is per tier (app/domain/scanner.py,
  # SCANNER_TIERS), not set here.
  #
  # HALF OF THIS BLOCK IS A FIRST-RUN SEED, NOT A SETTING
  # -----------------------------------------------------
  # The five filter keys below — scan_code, above_price, below_price,
  # above_trade_rate, change_perc_above — seed each tier's ScannerConfig the
  # first time the terminal runs. After that config/state.yaml owns them:
  # pressing Apply in the UI writes every filter there, and adopt_config
  # reads it back at startup and wins. Editing them here once state.yaml
  # exists changes nothing, silently.
  #
  # To make an edit here take effect, delete the `scanners:` block from
  # config/state.yaml (it is regenerated), or just set the filter in the UI
  # instead — which is what the UI is for.
  #
  # The rest of the block is read on every run and state.yaml never touches
  # it: enabled, rank_window_seconds, location_code, instrument,
  # min_refresh_seconds and exclude_stock_types.
  enabled: true
  scan_code: TOP_TRADE_RATE
  below_price: 50.0
  change_perc_above: 10.0
  rank_window_seconds: 5.0

screener:
  # The TradingView screener needs no credentials and no TWS. Defaults are
  # the small-cap momentum screen: $2-$20, up 10%+, 5x the 10-day average
  # volume, float under 20M shares. All of it is adjustable from the UI.
  enabled: true
  refresh_seconds: 15
  price_min: 2.0
  price_max: 20.0
  change_min: 10.0
  volume_min: 100000
  rel_vol_min: 5.0
  float_max: 20000000
  rows: 30

edgar:
  # SEC EDGAR is the fundamentals and filings source, because IBKR is not one
  # on a retail account — every reqFundamentalData report answers error 10358.
  # No key and no subscription, but SEC does require a User-Agent identifying
  # the caller with a real contact address, and www.sec.gov answers 403
  # without one while data.sec.gov answers 200 to the same request. Set this
  # before the panel will show anything.
  enabled: true
  user_agent: "traderapp/1.0 (you@example.com)"
  # How often the focused symbol's filing trail is re-read, watching for an
  # offering that lands mid-session. One request a minute against SEC's
  # ten-a-second allowance.
  filing_poll_seconds: 60
