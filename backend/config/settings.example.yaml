# Copy to settings.yaml and fill in. settings.yaml is gitignored.
#
# Every value here can also come from the environment, which wins over this
# file. Nested keys use a double underscore:
#
#   TRADERAPP_ALPACA__KEY_ID=...
#   TRADERAPP_IBKR__ENABLED=false
#   TRADERAPP_LOG_LEVEL=DEBUG

log_level: INFO
default_symbol: AAPL
# The terminal trades from the 10-second chart; it is the default everywhere.
default_timeframe: 10s
# Which origins the API answers cross-origin, so the terminal opens on a phone
# or tablet over the home WiFi: the three RFC 1918 ranges, loopback and Bonjour
# names, on the dev and preview ports only. Without it the WebSocket connects —
# it is exempt from CORS — while every REST call fails, which reads as a
# half-loaded terminal rather than as a configuration problem. Set it empty to
# bind the terminal back to this laptop:
#   cors_origin_regex: ''

alpaca:
  key_id: ''
  secret_key: ''
  # iex         free, real-time, IEX exchange only
  # delayed_sip free, whole tape, delayed 15 minutes
  # sip         paid, whole tape, real time
  feed: iex
  # Live Benzinga headlines over Alpaca's news socket. Separate from `feed`,
  # which governs the price tape only: news is a different product and is not
  # delayed. Alpaca allows one news socket per account, and a second
  # connection takes it rather than sharing it, so two copies of this app
  # will trade the connection back and forth.
  news_stream: true
  # 10-second history on Alpaca is rebuilt from the raw trade tape, paged
  # newest-first; the cap bounds how far a very heavy tape is walked.
  # max_trade_pages: 40
  # The same walk for the *prior* sessions sitting behind the IBKR window.
  # Twelve pages is 120k trades — measured, the whole previous session for a
  # small-cap runner and the closing hours of it for a mega cap, which is the
  # part that has to join up with today.
  # max_prior_session_pages: 12

ibkr:
  # The app prefers IBKR for live data and falls back to Alpaca automatically
  # whenever TWS is not reachable, so leaving this on costs nothing.
  enabled: true
  host: 127.0.0.1
  port: 7496
  client_id: 1

history:
  # Minute history is one Alpaca request (newest ~10k bars); the days value
  # only bounds the requested window. The 10-second base is three slices: the
  # last 4 hours from IBKR up front, hours 4-12 from IBKR as a background
  # extension — with Alpaca's trade tape as the recent-slice fallback when TWS
  # is down — and behind those the previous session(s), always walked off
  # Alpaca's tape.
  # 20 days: the windowed-RVOL denominator wants real prior sessions,
  # not the handful a chart needs for display.
  intraday_days: 20
  # Daily history is one Alpaca request capped at 10k rows; 40 years is what
  # fills that page, so asking for less only throws away levels.
  daily_years: 40
  # How many sessions the 10-second window reaches back over, behind the
  # twelve hours IBKR serves. EMA 600 is the slowest line on that chart and
  # draws nothing at all until it has 600 bars — and a bar exists only where a
  # trade printed, so this is about the name rather than the clock. One
  # session covers a liquid runner; raise it for a genuinely thin one, at the
  # cost of one more capped tape walk per ticker switch.
  # tensec_prior_sessions: 1

tape:
  # TIME AND SALES — the print-by-print window under the context chart.
  # A separate reader on the same trade stream: no bars, no indicators, and
  # nothing here reaches either. There is no on/off switch, because a tape
  # that is not there is a window showing nothing.
  #
  # Rows held per symbol. The window itself keeps fewer; this is the depth a
  # fresh subscribe is handed, so it is really "how far back can I scroll
  # through the burst that just happened".
  buffer: 600
  # Symbols keeping a tape at once, evicted least-recently-printed. Well
  # above a session's worth of flipping between runners.
  max_symbols: 16

scanner:
  # The trade-rate scanner is IBKR-only; there is no Alpaca equivalent to
  # fall back to. The market-cap band is per tier (app/domain/scanner.py,
  # SCANNER_TIERS), not set here.
  #
  # HALF OF THIS BLOCK IS A FIRST-RUN SEED, NOT A SETTING
  # -----------------------------------------------------
  # The five filter keys below — scan_code, above_price, below_price,
  # above_trade_rate, change_perc_above — seed each tier's ScannerConfig the
  # first time the terminal runs. After that config/state.yaml owns them:
  # pressing Apply in the UI writes every filter there, and adopt_config
  # reads it back at startup and wins. Editing them here once state.yaml
  # exists changes nothing, silently.
  #
  # To make an edit here take effect, delete the `scanners:` block from
  # config/state.yaml (it is regenerated), or just set the filter in the UI
  # instead — which is what the UI is for.
  #
  # The rest of the block is read on every run and state.yaml never touches
  # it: enabled, rank_window_seconds, location_code, instrument,
  # min_refresh_seconds and exclude_stock_types.
  enabled: true
  scan_code: TOP_TRADE_RATE
  below_price: 50.0
  change_perc_above: 10.0
  rank_window_seconds: 5.0

screener:
  # The TradingView screener needs no credentials and no TWS. Defaults are
  # the small-cap momentum screen: $2-$20, up 10%+, 5x the 10-day average
  # volume, float under 20M shares. All of it is adjustable from the UI.
  enabled: true
  refresh_seconds: 15
  price_min: 2.0
  price_max: 20.0
  change_min: 10.0
  volume_min: 100000
  rel_vol_min: 5.0
  float_max: 20000000
  rows: 30

edgar:
  # SEC EDGAR is the fundamentals and filings source, because IBKR is not one
  # on a retail account — every reqFundamentalData report answers error 10358.
  # No key and no subscription, but SEC does require a User-Agent identifying
  # the caller with a real contact address, and www.sec.gov answers 403
  # without one while data.sec.gov answers 200 to the same request. Set this
  # before the panel will show anything.
  enabled: true
  user_agent: "traderapp/1.0 (you@example.com)"
  # How often the focused symbol's filing trail is re-read, watching for an
  # offering that lands mid-session. One request a minute against SEC's
  # ten-a-second allowance.
  filing_poll_seconds: 60

# The news panel's top half: one day of headlines, read and scored out of ten
# by the `claude` CLI already installed on this machine. The rubric is Ross
# Cameron's treatment of catalysts — cost of production first, then the
# credibility checks — so an FDA clearance with a registered direct bolted to
# it scores a 2 rather than reading as upside. See docs/news-summary.md.
#
# The reader runs with `--tools ""`, `--safe-mode` and `--strict-mcp-config`:
# no shell, no filesystem, no CLAUDE.md, no MCP servers. It gets text and
# returns a scored object, which is the whole of what it is trusted with.
news_ai:
  # On. With the CLI missing the panel says so in one line rather than
  # failing; the toolbar's AI switch is the per-session control.
  enabled: true
  # Resolved on PATH, then in ~/.local/bin and the Homebrew prefixes. A value
  # with a "/" in it is taken as a path and used as given.
  command: claude
  # An alias ('sonnet', 'opus') or a full model id. `sonnet` resolves to the
  # newest Sonnet — Sonnet 5 today — and reads a press release as well as
  # anything for about a cent a reading. Both panels should carry the same
  # value: the setup judge takes this one's score as an input.
  model: sonnet
  # Measured at 5-20s depending on how many article bodies came back. This is
  # the ceiling before the panel gives up and prints why.
  timeout_seconds: 90
  # A hard per-reading ceiling handed to the CLI. Only bites on a runaway.
  max_budget_usd: 0.25
  # How long a reading stands before newly arrived headlines are allowed to
  # start another. A busy pre-market delivers a headline a minute, and each
  # one would otherwise launch a process; the panel marks the reading
  # "behind" in the meantime, and its refresh button overrides this.
  min_interval_seconds: 120

# The dock's AI tab: the whole screen judged out of ten against Ross Cameron's
# five pillars, weighed jointly rather than counted. Same reader and same
# flags as the news summary above; what differs is the prompt, and that this
# one is asked for rather than following a feed — a setup is a moving target,
# so a judgement is dated instead of cached and the panel says when the tape
# has moved past it. See docs/setup-judgement.md.
setup_ai:
  enabled: true
  command: claude
  # Must match news_ai.model — see the note there.
  model: sonnet
  # Measured at 60-120s: a much larger prompt than the news one — five
  # pillars, a level ladder, the tape and the news score — and a considered
  # judgement rather than a summary. The ceiling is well clear of the slow
  # end, because a reading that times out has spent the money and thrown the
  # answer away.
  timeout_seconds: 240
  max_budget_usd: 0.35

trading:
  # ORDER ENTRY. This is the one part of the app that spends money, and it is
  # off unless this line says otherwise. See docs/order-entry.md.
  #
  # Before it can work at all, in TWS: Global Configuration -> API ->
  # Settings -> untick "Read-Only API". That checkbox — not anything here —
  # is what actually enforces read-only, so with it ticked every order comes
  # back rejected however this file is set.
  enabled: false
  host: 127.0.0.1
  # 7496 live TWS, 7497 paper TWS, 4001/4002 the gateway equivalents. The
  # strip reads this to say LIVE or PAPER rather than asking you to remember.
  port: 7496
  # A second connection on its own client id: the market-data client is 1 and
  # is read-only, and order flow does not belong on the socket that runs the
  # scanners and the history.
  client_id: 2
  # Blank means the single managed account, which is the usual case.
  account: ""

  # How far through the book a marketable limit is priced — a *cap*, not a
  # price. A limit fills at the best available price, so five cents through
  # the offer still fills at the offer when there is size there; the slack is
  # only spent when the book moves between the click and the arrival.
  #
  # Two parts, larger wins. Five cents is 12 bps on a $40 name and 12.5% on a
  # $0.40 one, so a flat figure is the wrong shape at one end or the other.
  # At 5c and 15bps the two cross at $33.33.
  offset_cents: 5
  offset_bps: 15

  # The buy buttons in dollars, and the sell buttons as fractions of the
  # position. Display order, left to right; 1.0 renders as ALL.
  buy_dollars: [10, 25, 50]
  sell_fractions: [0.25, 0.5, 1.0]

  # DAY over IOC deliberately. At these sizes a marketable limit essentially
  # always fills, so the difference is a tail either way — but DAY's failure
  # is a resting order that shows in the working count and can be cancelled,
  # while IOC's is a sell that silently cancelled and left a position you
  # believe is closed.
  tif: DAY
  # Not optional for this workflow: small-cap momentum runs pre-market, and
  # without this a limit order sits unfilled until 09:30. It is also why
  # these are limits — TWS refuses market orders outside regular hours.
  outside_rth: true

  # A hard ceiling on one order's notional, checked server-side before
  # anything reaches TWS and measured at the limit rather than at the ask, so
  # it bounds the worst case. Sixty is a hair above the largest button, which
  # means no arithmetic fault anywhere in the stack can produce an order
  # larger than the one you clicked. Raising the buttons means raising this.
  max_order_dollars: 60
