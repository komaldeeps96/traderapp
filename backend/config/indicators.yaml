indicators:
  # --- 1m/1d EMAs ---
  - id: ema9
    type: ema
    label: EMA 9
    color: '#3b82f6'
    timeframes:
      1m: { span: 9, default_enabled: true }
      1d: { span: 9, default_enabled: true }

  - id: ema20
    type: ema
    label: EMA 20
    color: '#eab308'
    timeframes:
      1m: { span: 20, default_enabled: true }
      1d: { span: 20, default_enabled: true }

  - id: ema45
    type: ema
    label: EMA 45
    color: '#ec4899'
    timeframes:
      1m: { span: 45, default_enabled: true }

  - id: ema50
    type: ema
    label: EMA 50
    color: '#ec4899'
    timeframes:
      1d: { span: 50, default_enabled: false }

  # --- VWAP (intraday only) ---
  - id: vwap
    type: vwap
    label: VWAP
    color: '#7B1FA2'
    timeframes:
      1m:  { default_enabled: true }

  # --- Daily overlays (intraday only) ---
  - id: d_sma20
    type: daily
    label: 1D SMA 20
    span: 20
    color: '#000000'
    line_width: 1
    line_style: solid
    price_line_visible: true
    last_value_visible: true
    timeframes:
      1m:  { default_enabled: true }

