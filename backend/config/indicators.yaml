  - id: d_ema200
    type: daily_level
    label: 1D EMA 200
    level: ema:200
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *intraday

  # ── Sub-panes ──────────────────────────────────────────────────────
  # Volume bars take the candle's own up/down colour, so the pane needs no
  # hue of its own.
  #
  # A trade-count pane is also supported and is deliberately not enabled —
  # the count is already in the toolbar readout as "T". To bring the pane
  # back, add an entry with `type: trades` alongside this one; no code change
  # is needed.
  - id: volume
    type: volume
    label: Volume
    color: '#898781'
    group: panes
    timeframes:
      10s: { enabled: true }
      1m: { enabled: true }
      5m: { enabled: true }
      15m: { enabled: true }
      1h: { enabled: true }
      1d: { enabled: true }
      1w: { enabled: true }

  # MACD 12/26/9 on close, 1-minute only — deliberately: on the 10s chart it
  # whipsaws, on the 5m it lags, and the settings stay at platform defaults
  # so the crossovers land where every other trader sees them. Read as a
  # red-light/green-light: histogram negative means the trend is exhausted.
  - id: macd
    type: macd
    label: MACD 12·26·9
    color: '#2a78d6'
    color_dark: '#3987e5'
    group: panes
    timeframes:
      1m: { enabled: true }
