# Chart indicators.
#
# Adding an indicator is a change to this file — no code. The schema is
# validated at startup (app/indicators/spec.py), so a typo fails loudly.
#
# WHY THE KEY LEVELS ARE ALL ON BY DEFAULT
# ----------------------------------------
# For small-cap momentum the levels *are* the setup, not decoration. The
# pre-market high is the breakout trigger on a gapper; the previous close is
# what the gap is measured from; the 13/26/52-week highs are where a runner
# meets real supply. The sidebar lists every level sorted by price with its
# distance from the last trade, so the question "what is the nearest level
# above me, and how far?" is answered at a glance. Turning them off by default
# would break that.
#
# COLOUR SYSTEM
# -------------
# The moving averages and VWAP carry categorical hues, validated for
# colour-vision-deficiency separation against both chart surfaces under the
# strict all-pairs rule (any two lines can cross anywhere).
#
# VWAP used to sit in the neutral family and was indistinguishable from the
# key levels beside it — measured at dE 10.8 light and 9.9 dark, where under
# 15 reads as the same colour. It is a benchmark price, not a level, and has
# carried a hue of its own since.
#
# That hue was a bright blue, which fixed the levels and broke the EMAs: the
# fast EMA is blue too, and the pair measured dE 14.5 against the dark surface
# — under the 15 floor, so two of the four lines on the chart read as the same
# colour to anyone with full colour vision. VWAP is magenta now, which is the
# one direction nothing else on this chart occupies: it clears the EMA blue at
# dE 27/28 (light/dark), the violet and amber confluence bands at 20/20, the
# neutral levels at 25/25 and the candle bodies at 17/22, with protan/deutan
# separation of 12 or better on every one of those pairs. The bright blue also
# sat below 3:1 against the light surface and outside the dark lightness band;
# these steps clear both.

#
# Every key level is one solid neutral line. They used to be tiered by weight
# and dash pattern — 2px dotted for the pre-market range, 2px dashed for the
# previous close, and so on — which made a handful of them conspicuously
# unlike the rest for a distinction the eye had to be taught.
#
# The tiering was also mostly fiction. Key levels are restyled every frame by
# the confluence pass (frontend selectors.ts, buildLevelStyles), which
# overwrites colour, weight and the axis label from cluster strength and
# proximity. Only line_style survived it, so dash patterns were the one
# configured property that still reached the chart — and the widths and
# colours below had no effect at all.
#
# What differentiates a level now is what it is worth: the nearest band
# overhead draws violet, the nearest beneath amber, everything else recedes to
# grey, and stacked levels thicken into one band. Those two hues avoid the
# candle red/green and the three EMA hues, and sit on the blue-yellow axis so
# they stay apart under red-green colour blindness.
#
# Key levels set last_value: true, so each is labelled on the price axis and
# identity never rests on colour alone. The moving averages and VWAP do not:
# they move with price, so their tags crowd the axis around the last trade —
# exactly where the levels that matter are read. Their colours are named in
# the legend over the top-left of the chart.
#
# 'level' values: sma:N | ema:N | high:N | low:N (N = daily bars, or Nw for
# calendar weeks), one of prev_{day,week,month,quarter,year}_{high,low,close},
# or ytd_high for the current calendar year.

# A timeframe listed here means "this indicator is *meaningful* on this bar
# size", which is what the backend computes against. The `enabled` flag beside
# it is only the default the toggle starts at -- once a chart has been toggled,
# the saved state wins. So the question when adding a timeframe is never "do I
# want this on", it is "would this line mean anything here".
#
# Three of the four sets below therefore list every timeframe and differ only
# in what they start switched on. `intraday` is the exception, and it is a
# genuine one: a session VWAP on a weekly bar retraces the closes, a pre-market
# high cannot be derived from daily bars at all, and the engine guards both.
_anchors:
  # Session-derived: computed from the chart's own intraday bars, so these
  # have nothing to read on a daily or weekly one.
  intraday: &intraday
    10s: { enabled: true }
    1m: { enabled: true }
    5m: { enabled: true }
    15m: { enabled: true }
    30m: { enabled: true }
    1h: { enabled: true }
    4h: { enabled: true }

  # Means the same thing at any bar size: the moving averages over the
  # chart's own closes, and volume.
  every: &every
    10s: { enabled: true }
    1m: { enabled: true }
    5m: { enabled: true }
    15m: { enabled: true }
    30m: { enabled: true }
    1h: { enabled: true }
    4h: { enabled: true }
    1d: { enabled: true }
    1w: { enabled: true }

  # Daily levels compute from the daily index rather than the chart's bars,
  # so they are meaningful on every timeframe including the daily itself.
  # Twenty-eight of them switched on would bury a daily chart, so they are
  # present-but-off up there: the toggle exists, the chart stays legible.
  levels: &levels
    10s: { enabled: true }
    1m: { enabled: true }
    5m: { enabled: true }
    15m: { enabled: true }
    30m: { enabled: true }
    1h: { enabled: true }
    4h: { enabled: true }
    1d: { enabled: false }
    1w: { enabled: false }

  # The handful worth having on by default when the daily chart opens: the
  # 200-day and the yearly range are what a multi-day position is read
  # against, and leaving them off would make the daily chart emptier than
  # the ten-second one.
  levels_on: &levels_on
    10s: { enabled: true }
    1m: { enabled: true }
    5m: { enabled: true }
    15m: { enabled: true }
    30m: { enabled: true }
    1h: { enabled: true }
    4h: { enabled: true }
    1d: { enabled: true }
    1w: { enabled: true }

indicators:
  # ── Moving averages ────────────────────────────────────────────────
  # On the 10s chart each EMA runs with its 1-minute span times six (six
  # 10-second bars per minute), so the line tracks the same 1-minute EMA the
  # rest of the day is planned around: 9 -> 54, 20 -> 120, 45 -> 270,
  # 100 -> 600. Same id, same colour, same toggle across timeframes.
  #
  # EMA 100's olive is the one hue left, and it is a compromise made with the
  # numbers in hand. Measured against every other line, band and candle body
  # on both surfaces: for normal colour vision it is comfortably clear of
  # everything (dE 23 to EMA 45, 45 to EMA 20, 63 to EMA 9, 72 to VWAP light;
  # 30/53/70/87 dark). Under protan and deutan simulation it is not — it
  # collapses onto EMA 20's orange (dE 7.9 light, 16.5 dark) and onto the
  # amber confluence band (5.6 / 9.9). Green is not the collision anyone
  # expects it to be: that pair stays at dE 61.
  #
  # Nothing better exists. Blue, orange, green and magenta already span the
  # axes dichromats can separate, so every remaining gap collapses onto an
  # existing line under simulation — cyan onto green at dE 2.3, indigo onto
  # blue at 3.4, purple onto magenta at 12.8. A fifth categorical hue on this
  # chart is not available; this one buys full separation for trichromats and
  # spends the red-green channel to get it.
  - id: ema9
    type: ema
    label: EMA 9
    span: 9
    color: '#2a78d6'
    color_dark: '#3987e5'
    line_width: 1
    last_value: false
    group: moving_averages
    timeframes:
      10s: { enabled: true, span: 54, label: EMA 54 }
      1m: { enabled: true }
      5m: { enabled: true }
      15m: { enabled: true }
      30m: { enabled: true }
      1h: { enabled: true }
      4h: { enabled: true }
      1d: { enabled: true }
      1w: { enabled: true }

  - id: ema20
    type: ema
    label: EMA 20
    span: 20
    color: '#eb6834'
    color_dark: '#d95926'
    line_width: 1
    last_value: false
    group: moving_averages
    timeframes:
      10s: { enabled: true, span: 120, label: EMA 120 }
      1m: { enabled: true }
      5m: { enabled: true }
      15m: { enabled: true }
      30m: { enabled: true }
      1h: { enabled: true }
      4h: { enabled: true }
      1d: { enabled: true }
      1w: { enabled: true }

  - id: ema45
    type: ema
    label: EMA 45
    span: 45
    color: '#1baf7a'
    color_dark: '#199e70'
    line_width: 1
    last_value: false
    group: moving_averages
    timeframes:
      10s: { enabled: true, span: 270, label: EMA 270 }
      1m: { enabled: true }
      5m: { enabled: true }
      15m: { enabled: true }
      30m: { enabled: true }
      1h: { enabled: true }
      4h: { enabled: true }

  # The slow structural line: 100 minutes, which is the one the 10-second
  # tape is read against when the fast fan has gone vertical and the question
  # is how far price has travelled from anything durable.
      1d: { enabled: true }
      1w: { enabled: true }

  - id: ema100
    type: ema
    label: EMA 100
    span: 100
    color: '#788e0b'
    color_dark: '#beda2f'
    line_width: 1
    last_value: false
    group: moving_averages
    timeframes:
      10s: { enabled: true, span: 600, label: EMA 600 }
      1m: { enabled: true }
      5m: { enabled: true }
      15m: { enabled: true }
      30m: { enabled: true }
      1h: { enabled: true }
      4h: { enabled: true }
      1d: { enabled: true }
      1w: { enabled: true }

  - id: ema50
    type: ema
    label: EMA 50
    span: 50
    color: '#1baf7a'
    color_dark: '#199e70'
    line_width: 1
    last_value: true
    group: moving_averages
    timeframes:
      1d: { enabled: true }

  # ── Session benchmark ──────────────────────────────────────────────
  # Windowed relative volume: today's 4am-to-here volume against a typical
  # session's volume by the same time of day. The minute base supplies the
  # exact figure for the few sessions it covers and the shape of the day;
  # the daily base carries that shape back over 50 sessions. Readout-only —
  # a ratio has no business on a price pane; the top-panel strip reads it
  # out per bar, 10-second charts included (stepping once a minute there).
      1w: { enabled: true }

  - id: wrvol
    type: wrvol
    label: Windowed RVOL
    color: '#898781'
    group: session
    timeframes:
      10s: { enabled: true }
      1m: { enabled: true }
      5m: { enabled: true }
      15m: { enabled: true }
      30m: { enabled: true }
      1h: { enabled: true }
      4h: { enabled: true }

  - id: vwap
    type: vwap
    label: VWAP
    color: '#93126b'
    color_dark: '#bc0b97'
    line_width: 1
    last_value: false
    group: session
    timeframes: *intraday

  # ── Breakout trigger: the pre-market range ─────────────────────────
  - id: pm_high
    type: premarket
    label: PM High
    bound: high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: pm_low
    type: premarket
    label: PM Low
    bound: low
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  # ── Session boundaries: where each part of the day began ───────────
  # PM Open is the first pre-market print; RTH Open the 09:30 print, and
  # it is undefined before then rather than drawn flat across the
  # pre-market. AH High is the *previous* session's after-hours extreme —
  # twenty hours back, so it comes from the minute base, not the 10s window.
  - id: pm_open
    type: session_level
    label: PM Open
    level: pm_open
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: rth_open
    type: session_level
    label: RTH Open
    level: rth_open
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: ah_high
    type: session_level
    label: AH High
    level: ah_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  # ── Today's range: the momentum premise and the profit target ──────
  # The scanner fires on a new high of day, the crowd converges on it, and
  # "retest of the high of day" is the usual target — so unlike every other
  # key level here, these two are meant to move as the day trades.
  - id: hod
    type: session_bound
    label: HOD
    bound: high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: lod
    type: session_bound
    label: LOD
    bound: low
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  # ── Gap reference: the previous session ────────────────────────────
  - id: prev_day_close
    type: daily_level
    label: Prev Day Close
    level: prev_day_close
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_day_high
    type: daily_level
    label: Prev Day High
    level: prev_day_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_day_low
    type: daily_level
    label: Prev Day Low
    level: prev_day_low
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  # ── Swing levels ───────────────────────────────────────────────────
  - id: prev_week_high
    type: daily_level
    label: Prev Week High
    level: prev_week_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_week_low
    type: daily_level
    label: Prev Week Low
    level: prev_week_low
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_week_close
    type: daily_level
    label: Prev Week Close
    level: prev_week_close
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_month_high
    type: daily_level
    label: Prev Month High
    level: prev_month_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_month_low
    type: daily_level
    label: Prev Month Low
    level: prev_month_low
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_month_close
    type: daily_level
    label: Prev Month Close
    level: prev_month_close
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_quarter_high
    type: daily_level
    label: Prev Qtr High
    level: prev_quarter_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_quarter_low
    type: daily_level
    label: Prev Qtr Low
    level: prev_quarter_low
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_quarter_close
    type: daily_level
    label: Prev Qtr Close
    level: prev_quarter_close
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_year_high
    type: daily_level
    label: Prev Year High
    level: prev_year_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_year_low
    type: daily_level
    label: Prev Year Low
    level: prev_year_low
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: prev_year_close
    type: daily_level
    label: Prev Year Close
    level: prev_year_close
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  # ── The year so far ────────────────────────────────────────────────
  # Anchored to 1 January, where the 52-week high beside it rolls. Early in
  # the year the two sit far apart and by December they nearly agree, and
  # the gap between them is how much of the yearly range belongs to this
  # year's move. Like every level here it stops at the previous close, so a
  # new high today shows up tomorrow rather than dragging the line along
  # under the trader.
  - id: ytd_high
    type: daily_level
    label: YTD High
    level: ytd_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  # ── Where a runner meets supply ────────────────────────────────────
  - id: high_13w
    type: daily_level
    label: 13W High
    level: high:13w
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: low_13w
    type: daily_level
    label: 13W Low
    level: low:13w
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: high_26w
    type: daily_level
    label: 26W High
    level: high:26w
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: low_26w
    type: daily_level
    label: 26W Low
    level: low:26w
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels

  - id: high_52w
    type: daily_level
    label: 52W High
    level: high:52w
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels_on

  - id: low_52w
    type: daily_level
    label: 52W Low
    level: low:52w
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *levels_on

  # ── Daily moving averages projected onto intraday ──────────────────
  - id: d_sma20
    type: daily_level
    label: 1D SMA 20
    level: sma:20
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *levels

  - id: d_sma50
    type: daily_level
    label: 1D SMA 50
    level: sma:50
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *levels

  - id: d_sma200
    type: daily_level
    label: 1D SMA 200
    level: sma:200
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *levels_on

  - id: d_ema20
    type: daily_level
    label: 1D EMA 20
    level: ema:20
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *levels

  - id: d_ema50
    type: daily_level
    label: 1D EMA 50
    level: ema:50
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *levels

  - id: d_ema200
    type: daily_level
    label: 1D EMA 200
    level: ema:200
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *levels

  # ── Sub-panes ──────────────────────────────────────────────────────
  # Volume bars take the candle's own up/down colour, so the pane needs no
  # hue of its own.
  #
  # A trade-count pane is also supported and is deliberately not enabled —
  # the count is already in the toolbar readout as "T". To bring the pane
  # back, add an entry with `type: trades` alongside this one; no code change
  # is needed.
  - id: volume
    type: volume
    label: Volume
    color: '#898781'
    group: panes
    timeframes:
      10s: { enabled: true }
      1m: { enabled: true }
      5m: { enabled: true }
      15m: { enabled: true }
      30m: { enabled: true }
      1h: { enabled: true }
      4h: { enabled: true }
      1d: { enabled: true }
      1w: { enabled: true }
