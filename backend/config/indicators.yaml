    timeframes: *intraday

  - id: prev_quarter_high
    type: daily_level
    label: Prev Qtr High
    level: prev_quarter_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: prev_quarter_low
    type: daily_level
    label: Prev Qtr Low
    level: prev_quarter_low
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: prev_quarter_close
    type: daily_level
    label: Prev Qtr Close
    level: prev_quarter_close
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: prev_year_high
    type: daily_level
    label: Prev Year High
    level: prev_year_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: prev_year_low
    type: daily_level
    label: Prev Year Low
    level: prev_year_low
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: prev_year_close
    type: daily_level
    label: Prev Year Close
    level: prev_year_close
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  # ── Where a runner meets supply ────────────────────────────────────
  - id: high_13w
    type: daily_level
    label: 13W High
    level: high:65
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: low_13w
    type: daily_level
    label: 13W Low
    level: low:65
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: high_26w
    type: daily_level
    label: 26W High
    level: high:130
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: low_26w
    type: daily_level
    label: 26W Low
    level: low:130
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
