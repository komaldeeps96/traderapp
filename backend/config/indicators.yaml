    type: daily_level
    label: Prev Week High
    level: prev_week_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: prev_week_low
    type: daily_level
    label: Prev Week Low
    level: prev_week_low
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: prev_week_close
    type: daily_level
    label: Prev Week Close
    level: prev_week_close
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: prev_month_high
    type: daily_level
    label: Prev Month High
    level: prev_month_high
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: key_levels
    timeframes: *intraday

  - id: prev_month_low
    type: daily_level
    label: Prev Month Low
    level: prev_month_low
