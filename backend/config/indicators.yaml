    timeframes: *intraday

  # ── Daily moving averages projected onto intraday ──────────────────
  - id: d_sma20
    type: daily_level
    label: 1D SMA 20
    level: sma:20
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *intraday

  - id: d_sma50
    type: daily_level
    label: 1D SMA 50
    level: sma:50
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *intraday

  - id: d_sma200
    type: daily_level
    label: 1D SMA 200
    level: sma:200
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *intraday

  - id: d_ema20
    type: daily_level
    label: 1D EMA 20
    level: ema:20
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
    group: daily_ma
    timeframes: *intraday

  - id: d_ema50
    type: daily_level
    label: 1D EMA 50
    level: ema:50
    color: '#6d6b66'
    color_dark: '#a8a69d'
    last_value: true
